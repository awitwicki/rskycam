name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "cargo_version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "full_version=${cargo_version}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cross-compile aarch64 (glibc 2.36, embedded UI)
        env:
          RSKYCAM_BUILD: ${{ github.run_number }}
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu.2.36 --features embed-ui

      - name: Package tarball
        run: |
          staging=$(mktemp -d)
          cp target/aarch64-unknown-linux-gnu/release/rskycam "$staging/"
          cp installer/rskycam.service installer/99-asi.rules installer/install.sh installer/apply-update.sh "$staging/"
          cp LICENSE assets/asi/ASI-LICENSE "$staging/"
          tar -C "$staging" -czf rskycam-aarch64.tar.gz \
            rskycam rskycam.service 99-asi.rules install.sh apply-update.sh LICENSE ASI-LICENSE
          sha256sum rskycam-aarch64.tar.gz > rskycam-aarch64.tar.gz.sha256

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rskycam-aarch64
          path: |
            rskycam-aarch64.tar.gz
            rskycam-aarch64.tar.gz.sha256

      - name: Tag release commit
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.full_version }}" -m "v${{ steps.version.outputs.full_version }}"
          git push origin "v${{ steps.version.outputs.full_version }}"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.full_version }}"
          name: "v${{ steps.version.outputs.full_version }}"
          files: |
            rskycam-aarch64.tar.gz
            rskycam-aarch64.tar.gz.sha256
          generate_release_notes: true
